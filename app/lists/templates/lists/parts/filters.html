{% load crispy_forms_tags %}
<div class="mb-4">
    <form method="get">
        <div class="collapse" id="collapseFilters">
            <div class="p-4 rounded-3">
                <div class="filters-bar">
                    {% crispy filter.form %}
                </div>

                <div class="d-flex align-items-center justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        Aplicar
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
